name: Fetch source video

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a066fd-areana-video
    paths:
      - .github/workflows/fetch-source-video.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a066fd-areana-video
      - name: Resolve WeTransfer download
        env:
          TRANSFER_ID: 447f68c9f4681d48741b5c2a57317edc20260903113914
          SECURITY_HASH: f247fc
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --retry 3 \
            'https://wetransfer.com/api/v4/transfers/'"$TRANSFER_ID"'/download' \
            -H 'content-type: application/json' \
            -H 'x-requested-with: XMLHttpRequest' \
            --data-raw '{"security_hash":"'"$SECURITY_HASH"'","intent":"entire_transfer"}')
          echo "$response" | jq .
          url=$(echo "$response" | jq -r '.direct_link // .download_url // empty')
          test -n "$url"
          curl -L --fail --retry 3 -o source-download "$url"
          file source-download
          ls -lh source-download
      - name: Commit source into editing branch
        run: |
          mkdir -p work/source
          mv source-download work/source/wetransfer-download
          git config user.name 'arena-video-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f work/source/wetransfer-download
          git commit -m 'Add downloaded source video'
          git push origin HEAD:arena/01a066fd-areana-video
