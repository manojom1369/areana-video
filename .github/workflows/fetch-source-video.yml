name: Fetch source video

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a066fd-areana-video
    paths:
      - .github/workflows/fetch-source-video.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve WeTransfer download
        env:
          TRANSFER_ID: 447f68c9f4681d48741b5c2a57317edc20260903113914
          SECURITY_HASH: f247fc
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --retry 3 \
            'https://wetransfer.com/api/v4/transfers/'"$TRANSFER_ID"'/download' \
            -H 'content-type: application/json' \
            -H 'x-requested-with: XMLHttpRequest' \
            --data-raw '{"security_hash":"'"$SECURITY_HASH"'","intent":"entire_transfer"}')
          echo "$response" | jq .
          url=$(echo "$response" | jq -r '.direct_link // .download_url // empty')
          test -n "$url"
          curl -L --fail --retry 3 -o source-download "$url"
          file source-download
          ls -lh source-download
      - name: Publish temporary source asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete arena-source-video --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create arena-source-video source-download \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Temporary source video' \
            --notes 'Temporary editing input; remove after delivery.'
