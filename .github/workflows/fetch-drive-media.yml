name: fetch-drive-media

# Bridge: the editing sandbox cannot reach Google Drive, but it can reach
# api.github.com. This workflow downloads the shared Drive file and stores
# it as dangling git blobs (no commit, nothing lands in history), then
# commits a tiny manifest so the sandbox knows which blob SHAs to fetch.

on:
  push:
    branches: ["arena/01a062ec-areana-video"]
    paths:
      - ".github/workflows/fetch-drive-media.yml"
      - "media/sources.txt"
  workflow_dispatch:
    inputs:
      url:
        description: "Google Drive share URL (or file id)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-drive-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdown + requests
        run: pip install --quiet gdown requests

      - name: Download from Google Drive
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          mkdir -p dl
          if [ -n "${INPUT_URL}" ]; then
            URL="${INPUT_URL}"
          else
            URL="$(grep -v '^\s*#' media/sources.txt | grep -m1 . )"
          fi
          echo "Fetching: ${URL}"
          gdown --fuzzy "${URL}" -O dl/source.bin
          ls -la dl
          file dl/source.bin || true
          python3 - <<'EOF'
          import hashlib, os
          p = "dl/source.bin"
          h = hashlib.sha256(open(p, "rb").read()).hexdigest()
          print("size", os.path.getsize(p), "sha256", h)
          EOF

      - name: Upload as chunked git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import base64, hashlib, json, os, requests, time
          repo = os.environ["REPO"]; tok = os.environ["GH_TOKEN"]
          path = "dl/source.bin"
          CHUNK = 40 * 1024 * 1024
          data = open(path, "rb").read()
          total = len(data)
          sha256 = hashlib.sha256(data).hexdigest()
          lines = [f"# source manifest (auto-generated by fetch-drive-media)",
                   f"file source.bin", f"size {total}", f"sha256 {sha256}"]
          hdr = {"Authorization": f"Bearer {tok}",
                 "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28"}
          n = 0
          for off in range(0, total, CHUNK):
              part = data[off:off+CHUNK]
              body = json.dumps({"encoding": "base64",
                                 "content": base64.b64encode(part).decode()})
              for attempt in range(5):
                  r = requests.post(f"https://api.github.com/repos/{repo}/git/blobs",
                                    headers=hdr, data=body, timeout=600)
                  if r.status_code == 201:
                      break
                  print("retry", attempt, r.status_code, r.text[:300])
                  time.sleep(5 * (attempt + 1))
              r.raise_for_status()
              sha = r.json()["sha"]
              lines.append(f"chunk {n} {sha} {len(part)}")
              print(f"chunk {n}: {len(part)} bytes -> blob {sha}")
              n += 1
          os.makedirs("media", exist_ok=True)
          open("media/manifest.txt", "w").write("\n".join(lines) + "\n")
          print(open("media/manifest.txt").read())
          EOF

      - name: Commit manifest back to the branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/manifest.txt
          git commit -m "chore(media): add blob manifest for Drive source [skip ci]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
