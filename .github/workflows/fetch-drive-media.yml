name: fetch-drive-media

# Bridge: the editing sandbox cannot reach Google Drive, but it can reach
# api.github.com. This workflow downloads the shared Drive file and stores
# it as dangling git blobs (no commit, nothing lands in history), then
# commits a tiny manifest so the sandbox knows which blob SHAs to fetch.
# Diagnostics are also committed (media/status.txt) because the sandbox
# cannot read Actions logs (they are served from blob storage it can't reach).

on:
  push:
    branches: ["arena/01a062ec-areana-video"]
    paths:
      - ".github/workflows/fetch-drive-media.yml"
      - "media/sources.txt"
  workflow_dispatch:
    inputs:
      url:
        description: "Google Drive share URL (or file id)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-drive-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install --quiet gdown requests
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true

      - name: Download from Google Drive (multi-strategy)
        id: dl
        continue-on-error: true
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p dl media
          : > media/status.txt
          log() { echo "$*" | tee -a media/status.txt; }
          if [ -n "${INPUT_URL}" ]; then URL="${INPUT_URL}"; else URL="$(grep -v '^\s*#' media/sources.txt | grep -m1 .)"; fi
          FID="$(echo "$URL" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p')"
          [ -z "$FID" ] && FID="$(echo "$URL" | sed -nE 's#.*[?&]id=([A-Za-z0-9_-]+).*#\1#p')"
          [ -z "$FID" ] && FID="$URL"
          log "url=$URL"
          log "file_id=$FID"

          ok=0
          # Strategy 1: gdown fuzzy
          log "--- strategy 1: gdown"
          gdown --version 2>&1 | tee -a media/status.txt
          gdown "$URL" -O dl/source.bin 2>&1 | tail -n 20 | tee -a media/status.txt
          [ -s dl/source.bin ] && ok=1
          # Strategy 2: gdown by id
          if [ $ok -eq 0 ]; then
            log "--- strategy 2: gdown --id"
            rm -f dl/source.bin
            gdown "https://drive.google.com/uc?id=${FID}" -O dl/source.bin 2>&1 | tail -n 20 | tee -a media/status.txt
            [ -s dl/source.bin ] && ok=1
          fi
          # Strategy 3: raw curl with confirm token (usercontent endpoint)
          if [ $ok -eq 0 ]; then
            log "--- strategy 3: curl usercontent"
            rm -f dl/source.bin
            curl -sSL -c dl/c.txt -b dl/c.txt "https://drive.usercontent.google.com/download?id=${FID}&export=download&confirm=t" -o dl/source.bin -w "http=%{http_code} ct=%{content_type} size=%{size_download}\n" | tee -a media/status.txt
            if head -c 512 dl/source.bin | grep -qi "<html"; then
              log "got html page instead of file:"
              head -c 4000 dl/source.bin | tr -d '\r' | grep -oiE "(quota|virus|cannot|denied|sign in|access|too many users|download anyway|uc-download-link[^>]*)" | sort -u | head -n 10 | tee -a media/status.txt
              # try to extract the confirm form and re-submit
              CONFIRM=$(grep -oE 'name="confirm" value="[^"]+"' dl/source.bin | head -1 | sed -E 's/.*value="([^"]+)"/\1/')
              UUID=$(grep -oE 'name="uuid" value="[^"]+"' dl/source.bin | head -1 | sed -E 's/.*value="([^"]+)"/\1/')
              log "confirm=$CONFIRM uuid=$UUID"
              if [ -n "$UUID" ]; then
                curl -sSL -c dl/c.txt -b dl/c.txt "https://drive.usercontent.google.com/download?id=${FID}&export=download&confirm=${CONFIRM:-t}&uuid=${UUID}" -o dl/source.bin -w "http=%{http_code} ct=%{content_type} size=%{size_download}\n" | tee -a media/status.txt
              fi
            fi
            if [ -s dl/source.bin ] && ! head -c 512 dl/source.bin | grep -qi "<html"; then ok=1; fi
          fi

          if [ $ok -eq 1 ]; then
            log "--- download OK"
            ls -la dl | tee -a media/status.txt
            file dl/source.bin | tee -a media/status.txt
            ffprobe -v error -show_entries format=duration,size,bit_rate:stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of default=nw=1 dl/source.bin 2>&1 | tee -a media/status.txt
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            log "--- ALL STRATEGIES FAILED"
            rm -f dl/source.bin
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload as chunked git blobs
        if: steps.dl.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import base64, hashlib, json, os, requests, time
          repo = os.environ["REPO"]; tok = os.environ["GH_TOKEN"]
          path = "dl/source.bin"
          CHUNK = 40 * 1024 * 1024
          data = open(path, "rb").read()
          total = len(data)
          sha256 = hashlib.sha256(data).hexdigest()
          lines = [f"# source manifest (auto-generated by fetch-drive-media)",
                   f"file source.bin", f"size {total}", f"sha256 {sha256}"]
          hdr = {"Authorization": f"Bearer {tok}",
                 "Accept": "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28"}
          n = 0
          for off in range(0, total, CHUNK):
              part = data[off:off+CHUNK]
              body = json.dumps({"encoding": "base64",
                                 "content": base64.b64encode(part).decode()})
              for attempt in range(5):
                  r = requests.post(f"https://api.github.com/repos/{repo}/git/blobs",
                                    headers=hdr, data=body, timeout=600)
                  if r.status_code == 201:
                      break
                  print("retry", attempt, r.status_code, r.text[:300])
                  time.sleep(5 * (attempt + 1))
              r.raise_for_status()
              sha = r.json()["sha"]
              lines.append(f"chunk {n} {sha} {len(part)}")
              print(f"chunk {n}: {len(part)} bytes -> blob {sha}")
              n += 1
          open("media/manifest.txt", "w").write("\n".join(lines) + "\n")
          print(open("media/manifest.txt").read())
          EOF

      - name: Commit manifest/status back to the branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/status.txt media/manifest.txt 2>/dev/null || git add media/status.txt
          git commit -m "chore(media): fetch-drive-media run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
